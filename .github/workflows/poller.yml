name: corporate-action-poller
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: corporate-action-poller-state
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run poller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The always-on bot server (bot_server.py, e.g. on Render) is the
          # only process that should poll Telegram commands. Keeping this off
          # in the cron prevents double replies and 409 getUpdates conflicts.
          # NOTE: this gates COMMANDS only. The cron still runs one alert
          # cycle, so an alert can be sent by both hosts - do not assume a
          # maintenance switch exists here.
          PROCESS_COMMANDS: "false"
        run: python3 run_bot.py
