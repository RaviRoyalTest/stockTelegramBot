<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Royal Stock{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/app.css" />
    <script>
      // apply the saved theme before first paint to avoid a flash
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved !== 'light' && saved !== 'dark') {
            saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', saved);
        } catch (e) { /* private mode */ }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">📈 Royal Stock</a>

        <button
          id="navToggle"
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="primaryNav"
          aria-label="Toggle navigation menu"
        >
          ☰
        </button>

        <nav id="primaryNav" class="nav" aria-label="Primary">
          <a href="/">🏠 Dashboard</a>
          <a href="/watchlist">📌 Watchlist</a>
          <a href="/fundamentals">💹 Fundamentals</a>
          <a href="/market">📊 Screener</a>
          <a href="/exdates">📋 Corporate actions</a>
          <a href="/system">⚙️ System</a>
        </nav>

        <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">🌙 Dark</button>
      </div>
    </header>

    <main id="main" class="container" tabindex="-1">
      {% block content %}{% endblock %}
    </main>

    <div class="toast-stack" aria-live="polite"></div>

    <footer class="footer">
      <span>Royal Stock · NSE &amp; BSE · Telegram bot</span>
      <span><a href="/health">/health</a></span>
    </footer>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
