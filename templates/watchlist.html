<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Watchlist - Royal Stock</title>
    <style>body{font-family:Arial;padding:20px}</style>
  </head>
  <body>
    <h1>Watchlist</h1>
    <div style="margin-bottom:8px">
      <label>Symbol: <input id="symbol"/></label>
      <label>Company: <input id="company"/></label>
      <button id="add">Add</button>
      <button id="download">Download CSV</button>
    </div>
    <div id="list"></div>
    <script>
      async function load(){
        const res = await fetch('/api/watchlist');
        const items = await res.json();
        document.getElementById('list').innerHTML = items.map(i=>`<div><b>${i.symbol}</b> — ${i.company||''} <button data-sym="${i.symbol}" data-ex="${i.exchange||'NSE'}" class="rm">Remove</button></div>`).join('');
        document.querySelectorAll('.rm').forEach(b=>b.addEventListener('click', async (e)=>{
          const s = e.currentTarget.getAttribute('data-sym');
          const ex = e.currentTarget.getAttribute('data-ex') || 'NSE';
          await fetch('/api/watchlist?symbol='+encodeURIComponent(s)+'&exchange='+encodeURIComponent(ex), {method:'DELETE'});
          load();
        }));
      }
      document.getElementById('add').addEventListener('click', async ()=>{
        const s=document.getElementById('symbol').value.trim();
        const c=document.getElementById('company').value.trim();
        if(!s) return alert('enter symbol');
        await fetch('/api/watchlist', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({items:[{symbol:s,company:c}]})});
        load();
      });
      document.getElementById('download').addEventListener('click', ()=>{ window.location = '/api/watchlist.csv'; });
      load();
    </script>
  </body>
</html>
