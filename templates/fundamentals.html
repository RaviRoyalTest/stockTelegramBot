<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fundamentals - Royal Stock</title>
    <style>body{font-family:Arial;padding:20px}</style>
  </head>
  <body>
    <h1>Fundamental Analysis</h1>
    <div style="margin-bottom:8px">
      <label>Symbol: <input id="symbol"/></label>
      <button id="go">Fetch</button>
      <button id="download">Download CSV</button>
    </div>
    <div id="card"></div>
    <canvas id="fundChart" width="600" height="200" style="max-width:600px;margin-top:12px"></canvas>
    <script>
      async function render(symbol){
        const res = await fetch('/api/fundamentals?symbol='+encodeURIComponent(symbol));
        if(!res.ok){ alert('error'); return }
        const data = await res.json();
        const f = data.fund||{};
        const q = data.quote||{};
        document.getElementById('card').innerHTML = `
          <h2>${data.symbol} — ${f.company||''}</h2>
          <table>
            <tr><td>Price</td><td>${q.price||'-'}</td></tr>
            <tr><td>Market Cap</td><td>${f.market_cap||'-'}</td></tr>
            <tr><td>P/E</td><td>${f.pe||'-'}</td></tr>
            <tr><td>ROE</td><td>${f.roe||'-'}</td></tr>
            <tr><td>Debt/Equity</td><td>${f.debt_to_equity||'-'}</td></tr>
          </table>
        `;
        // render small bar chart for PE vs ROE
        try{
          const ctx = document.getElementById('fundChart').getContext('2d');
          const labels = ['P/E','ROE'];
          const values = [f.pe||0, f.roe||0];
          if(window._fundChart) window._fundChart.destroy();
          window._fundChart = new Chart(ctx, {type:'bar', data:{labels:labels,datasets:[{label:data.symbol, data:values, backgroundColor:['#3b82f6','#10b981']}]} , options:{scales:{y:{beginAtZero:true}}}});
        }catch(e){/* ignore if Chart not available */}
      }
      document.getElementById('go').addEventListener('click', ()=>{
        const s = document.getElementById('symbol').value.trim(); if(!s) return alert('enter'); render(s);
      });
      document.getElementById('download').addEventListener('click', ()=>{
        const s = document.getElementById('symbol').value.trim(); if(!s) return alert('enter');
        window.location = '/api/fundamentals.csv?symbol='+encodeURIComponent(s);
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
